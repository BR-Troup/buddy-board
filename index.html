<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BuddyBoard" />
  <meta name="theme-color" content="#121216" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Buddy Board</title>
  <style>
    :root {
      --bg:#0f0f13; --panel:#1a1a22; --card:#22222c; --text:#f4f4f7; --muted:#9a9aa8;
      --accent:#ffc400; --work:#5b8cff; --personal:#57d39a; --email:#ff8f6b; --school:#c084fc; --other:#94a3b8;
      --late:#ff5c5c; --follow:#7dd3fc; --safe:env(safe-area-inset-top,0px); --safeb:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;overflow:hidden}
    #app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe)}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;gap:10px}
    header h1{font-size:18px;margin:0;font-weight:750;letter-spacing:-.02em}
    header .meta{color:var(--muted);font-size:12px;margin-top:2px}
    .pill{border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:650;background:var(--accent);color:#111}
    .pill.ghost{background:#2a2a33;color:var(--text)}
    .tabs{display:flex;gap:6px;padding:0 12px 10px}
    .tab{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700;font-size:14px;background:#1c1c24;color:var(--muted)}
    .tab.active{background:var(--card);color:var(--text);outline:1px solid #353545}
    .panel{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(16px + var(--safeb))}
    .panel.hidden{display:none}
    .synth{background:linear-gradient(135deg,#2a2438,#1a1a22);border:1px solid #353545;border-radius:16px;padding:12px 14px;margin-bottom:12px}
    .synth strong{display:block;font-size:12px;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
    .synth p{margin:0;font-size:14px;line-height:1.4;color:#ddd}
    .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 2px 6px}
    .cards{display:flex;flex-direction:column;gap:10px}
    .card{background:var(--card);border-radius:16px;padding:14px;border-left:4px solid var(--other);position:relative}
    .card.work{border-left-color:var(--work)} .card.personal{border-left-color:var(--personal)}
    .card.email{border-left-color:var(--email)} .card.school{border-left-color:var(--school)}
    .card.follow{box-shadow:inset 0 0 0 1px rgba(125,211,252,.35)}
    .card .title{font-size:15px;font-weight:650;line-height:1.3;margin:0 0 8px}
    .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:#333342;color:var(--muted)}
    .badge.late{background:rgba(255,92,92,.18);color:var(--late)}
    .badge.due{background:rgba(255,196,0,.15);color:var(--accent)}
    .badge.hi{background:rgba(255,92,92,.2);color:#ff8a8a}
    .badge.fu{background:rgba(125,211,252,.15);color:var(--follow)}
    .note{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .btn{flex:1;min-width:72px;border:0;border-radius:12px;padding:10px 8px;font-size:12px;font-weight:700;background:#2d2d38;color:var(--text)}
    .btn.email{background:#2a3550;color:#c7d7ff}
    .btn.done{background:#1f3a2d;color:#8dffb5}
    .btn.follow{background:#1e3340;color:#9ddcff}
    .btn.del{background:#3a2228;color:#ff9aa8;flex:0 0 auto;min-width:56px}
    .empty{color:var(--muted);font-size:14px;padding:20px 8px;text-align:center}
    #notesBox{width:100%;min-height:60vh;border:0;border-radius:16px;padding:14px;background:var(--card);color:var(--text);
      font-size:16px;line-height:1.45;resize:vertical;outline:none}
    .notes-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
    .notes-bar span{font-size:12px;color:var(--muted)}
    .toast{position:fixed;left:50%;bottom:calc(24px + var(--safeb));transform:translateX(-50%);background:#fff;color:#111;
      padding:10px 14px;border-radius:999px;font-size:13px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div>
        <h1>Buddy Board</h1>
        <div class="meta" id="updated">Loading…</div><div class="meta" id="buildStamp" style="color:#57d39a">build-v4 · email→Safari</div>
      </div>
      <button class="pill ghost" id="btnRefresh" type="button">Refresh</button>
    </header>
    <div class="tabs">
      <button class="tab active" data-tab="list" type="button">Punchlist</button>
      <button class="tab" data-tab="notes" type="button">Notes</button>
    </div>
    <div class="panel" id="panel-list">
      <div class="synth"><strong>Buddy synthesis</strong><p id="synthText">…</p></div>
      <div id="lists"></div>
    </div>
    <div class="panel hidden" id="panel-notes">
      <div class="notes-bar">
        <span>Saved on this device</span>
        <button class="pill ghost" id="btnClearNotes" type="button">Clear notes</button>
      </div>
      <textarea id="notesBox" placeholder="Type notes here — follow-ups, scratch, whatever you need…"></textarea>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
  const DONE_KEY='buddy-board-done-v1';
  const DEL_KEY='buddy-board-del-v1';
  const FU_KEY='buddy-board-fu-v1';
  const NOTES_KEY='buddy-board-notes-v1';
  let data={items:[]};

  const loadSet=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'))}catch{return new Set()}};
  const saveSet=(k,s)=>localStorage.setItem(k,JSON.stringify([...s]));
  let done=loadSet(DONE_KEY), deleted=loadSet(DEL_KEY), follow=loadSet(FU_KEY);

  
  function openEmail(it){
    // From a Home Screen PWA, window.open often uses a cookie-less sheet → Google login every time and the #thread is lost.
    // Opening via <a target=_blank> sends you to real Safari, which already has your Gmail session.
    const url = it.email_url;
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    // iOS standalone: this exits the PWA into Safari
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  async function copyLink(url){
    try { await navigator.clipboard.writeText(url); toast('Link copied — paste in Safari/Gmail'); }
    catch { prompt('Copy this Gmail link:', url); }
  }

  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
  function lateLabel(n){n=n||0;return n<=0?{text:'Due today',cls:'due'}:{text:n+(n===1?' day late':' days late'),cls:'late'}}

  function visibleItems(){
    return (data.items||[]).filter(it=>!done.has(it.id)&&!deleted.has(it.id));
  }

  function render(){
    document.getElementById('synthText').textContent=data.synthesis||'No synthesis yet.';
    document.getElementById('updated').textContent=data.updated_at?('Updated '+new Date(data.updated_at).toLocaleString()):'—';
    const items=visibleItems();
    const by={};
    items.forEach(it=>{const c=(it.category||'other').toLowerCase();(by[c]=by[c]||[]).push(it)});
    const order=['work','personal','email','school','other'];
    const lists=document.getElementById('lists');
    lists.innerHTML='';
    let any=false;
    for(const cat of order){
      const arr=by[cat]; if(!arr||!arr.length) continue; any=true;
      const lab=document.createElement('div'); lab.className='section-label'; lab.textContent=cat+' · '+arr.length;
      lists.appendChild(lab);
      const wrap=document.createElement('div'); wrap.className='cards';
      for(const it of arr){
        const late=lateLabel(it.days_late);
        const isFu=follow.has(it.id)||it.follow_up;
        const card=document.createElement('div');
        card.className='card '+cat+(isFu?' follow':'');
        const urg=it.urgency||'';
        card.innerHTML=`<p class="title"></p><div class="row"></div><p class="note" style="display:none"></p><div class="actions"></div>`;
        card.querySelector('.title').textContent=it.text;
        const row=card.querySelector('.row');
        const b1=document.createElement('span'); b1.className='badge '+late.cls; b1.textContent=late.text; row.appendChild(b1);
        if(urg){const b=document.createElement('span'); b.className='badge'+(urg==='High'?' hi':''); b.textContent=urg; row.appendChild(b)}
        if(isFu){const b=document.createElement('span'); b.className='badge fu'; b.textContent='Follow-up'; row.appendChild(b)}
        if(it.note){const n=card.querySelector('.note'); n.style.display='block'; n.textContent=it.note}
        const actions=card.querySelector('.actions');
        const mk=(cls,label,fn)=>{const b=document.createElement('button'); b.type='button'; b.className='btn '+cls; b.textContent=label; b.onclick=fn; return b};
        if(it.email_url){
          actions.appendChild(mk('email','Email',()=>openEmail(it)));
          actions.appendChild(mk('','Copy',()=>copyLink(it.email_url)));
        }
        actions.appendChild(mk('done','Done',()=>{done.add(it.id); follow.delete(it.id); saveSet(DONE_KEY,done); saveSet(FU_KEY,follow); toast('Done — tell Buddy: done: '+it.text); render()}));
        actions.appendChild(mk('follow', isFu?'Unflag':'Follow-up',()=>{
          if(follow.has(it.id)) follow.delete(it.id); else follow.add(it.id);
          saveSet(FU_KEY,follow); render();
        }));
        actions.appendChild(mk('del','Delete',()=>{
          if(!confirm('Remove from your board view?')) return;
          deleted.add(it.id); follow.delete(it.id); saveSet(DEL_KEY,deleted); saveSet(FU_KEY,follow);
          toast('Deleted locally — tell Buddy to drop it for good'); render();
        }));
        wrap.appendChild(card);
      }
      lists.appendChild(wrap);
    }
    if(!any) lists.innerHTML='<div class="empty">All clear on this device. Pull to refresh after Buddy publishes, or add notes in the Notes tab.</div>';
  }

  async function loadTodos(){
    const res=await fetch('todos.json?ts='+Date.now(),{cache:'no-store'});
    data=await res.json();
    render();
  }

  document.querySelectorAll('.tab').forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===btn));
      document.getElementById('panel-list').classList.toggle('hidden', btn.dataset.tab!=='list');
      document.getElementById('panel-notes').classList.toggle('hidden', btn.dataset.tab!=='notes');
    };
  });

  const notes=document.getElementById('notesBox');
  notes.value=localStorage.getItem(NOTES_KEY)||'';
  let notesTimer=null;
  notes.addEventListener('input',()=>{
    clearTimeout(notesTimer);
    notesTimer=setTimeout(()=>localStorage.setItem(NOTES_KEY, notes.value),200);
  });
  document.getElementById('btnClearNotes').onclick=()=>{
    if(confirm('Clear all typed notes on this device?')){notes.value=''; localStorage.removeItem(NOTES_KEY)}
  };
  document.getElementById('btnRefresh').onclick=()=>loadTodos().catch(console.error);
  loadTodos().catch(()=>{document.getElementById('synthText').textContent='Could not load punchlist yet.';});
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});
  // purge ancient SW if stuck
  navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(!r.active||!(r.active.scriptURL||'').includes('sw.js'))r.unregister()}));
  </script>
</body>
</html>
